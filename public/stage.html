<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poster Stage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #080f09; }
  body { font-family: 'Press Start 2P', monospace; color: #e6f0e2; cursor: none; }
  body.show-cursor { cursor: default; }

  /* Гра — фон на весь екран, усе інше поверх неї */
  #game {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    image-rendering: pixelated;
    display: block;
    z-index: 0;
  }

  /* ─── Верхній рядок: мінімум ────────────────────────────── */
  /* Лічильники й підказки клавіш з екрана прибрані: на проекції має бути
     тільки те, що гість може прочитати як частину гри. Єдине, що лишилось
     від службового, — крапка звʼязку в кутку картки, для оператора. */
  .dot { width: 5px; height: 5px; background: #34482f; margin-left: auto; }
  .dot.on { background: #6e8f5a; box-shadow: 0 0 6px #6e8f5a; }

  /* ─── Мінікарта ─────────────────────────────────────────── */
  .map-wrap {
    position: fixed; left: 20px; bottom: 20px; z-index: 3;
    border: 2px solid #2c4230; background: #070d08;
    box-shadow: 0 3px 0 #04080500;
    padding: 4px;
    opacity: 0.92;
  }
  #minimap { display: block; image-rendering: pixelated; }
  .map-label {
    display: flex; align-items: center;
    font-size: 6px; color: #3e5738; letter-spacing: 0.12em;
    padding: 5px 2px 1px;
  }

  /* ─── Легенда: яке пиво веде куди ───────────────────────── */
  .legend {
    position: fixed; right: 18px; top: 50%; transform: translateY(-50%);
    z-index: 3; display: flex; flex-direction: column; gap: 12px;
    max-width: 270px; pointer-events: none;
  }
  .lg-group {
    display: grid; grid-template-columns: 26px 1fr; gap: 10px;
    align-items: start;
    background: #0c130ddd; border-left: 3px solid;
    padding: 9px 11px 9px 9px;
  }
  .lg-arrow { font-size: 19px; line-height: 1; text-align: center; }
  .lg-beers { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .lg-beer {
    font-size: 7px; line-height: 1.5; color: #b9cdb0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .lg-beer.hit { color: #fff; }

  /* Група підсвічується, коли з неї щойно купили */
  .lg-group.flash { background: #16211466; }

  /* ─── Плашка «яке пиво → куди веде» ─────────────────────── */
  .call {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(14px);
    z-index: 4;
    display: flex; align-items: center; gap: 20px;
    padding: 16px 26px;
    background: #101a12ee; border: 3px solid #6e8f5a;
    box-shadow: 0 5px 0 #04080a;
    max-width: min(76vw, 760px);
    opacity: 0; pointer-events: none;
    transition: opacity 0.22s ease, transform 0.22s ease;
  }
  .call.on { opacity: 1; transform: translateX(-50%) translateY(0); }
  .call.slid { border-color: #ffcf4a; }

  .call-arrow { font-size: 34px; line-height: 1; color: #ffcf4a; flex: none; }
  .call-beer {
    font-size: 15px; line-height: 1.45; color: #fff;
    overflow: hidden; text-overflow: ellipsis; display: -webkit-box;
    -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }
  .call-dir { font-size: 8px; color: #93b57c; margin-top: 11px; letter-spacing: 0.08em; }
  .call-qty { font-size: 9px; color: #ffcf4a; flex: none; }

  /* ─── Бонус фрукта ──────────────────────────────────────── */
  /* ─── Банер дверей: яке пиво їх відмикає ────────────────── */
  .door {
    position: fixed; left: 50%; top: 44px; transform: translateX(-50%);
    z-index: 4; display: none; align-items: center; gap: 16px;
    padding: 12px 22px; background: #0e1114ee;
    border: 3px solid #6b7078; box-shadow: 0 4px 0 #04080a;
    max-width: min(70vw, 640px);
  }
  .door.on { display: flex; }
  .door.open { border-color: #ffcf4a; background: #16140aee; }
  .door-icon { font-size: 20px; line-height: 1; flex: none; }
  .door-state { font-size: 7px; color: #8d9199; letter-spacing: 0.1em; }
  .door.open .door-state { color: #ffcf4a; }
  .door-beer { font-size: 12px; color: #fff; margin-top: 9px; }

  /* Заставка нової кімнати */
  .splash {
    position: fixed; inset: 0; z-index: 6;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
    background: #04080ae8;
    opacity: 0; pointer-events: none; transition: opacity 0.35s ease;
  }
  .splash.on { opacity: 1; }
  .splash-n { font-size: 10px; color: #6e8f5a; letter-spacing: 0.24em; }
  .splash-t { font-size: 30px; text-shadow: 3px 3px 0 #04080a; }

  .fruit {
    position: fixed; left: 50%; top: 132px; transform: translateX(-50%);
    z-index: 4; display: flex; align-items: center; gap: 12px;
    padding: 11px 18px; background: #101a12ee; border: 3px solid #ffcf4a;
    opacity: 0; transition: opacity 0.25s ease; pointer-events: none;
  }
  .fruit.on { opacity: 1; }
  .fruit-swatch { width: 14px; height: 14px; flex: none; }
  .fruit-name { font-size: 9px; color: #ffcf4a; }
  .fruit-desc { font-size: 7px; color: #93b57c; margin-top: 7px; }

  /* ─── Перемога ──────────────────────────────────────────── */
  .win {
    position: fixed; inset: 0; z-index: 5;
    background: #080f09e0;
    display: none; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
  }
  .win.on { display: flex; }
  .win-t { font-size: 26px; color: #ffcf4a; text-shadow: 3px 3px 0 #48613a; }
  .win-s { font-size: 10px; color: #93b57c; line-height: 2; text-align: center; }

  /* ─── Слот: безкоштовне пиво ────────────────────────────── */
  /* Три фази: барабан крутиться → зупиняється на призі → плашка з таймером
     їде в куток і висить до кінця хвилини, поки гра йде далі. */
  .slot {
    position: fixed; inset: 0; z-index: 8;
    display: none; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
    background: #050805f2;
  }
  .slot.on { display: flex; }
  .slot-t {
    font-size: 11px; color: #ffcf4a; letter-spacing: 0.3em;
    animation: slot-blink 0.5s steps(2, end) infinite;
  }
  @keyframes slot-blink { 50% { opacity: 0.25; } }
  .slot-reel {
    min-width: min(74vw, 780px); max-width: min(74vw, 780px);
    padding: 26px 30px; text-align: center;
    border: 4px solid #ffcf4a; background: #141008;
    box-shadow: 0 6px 0 #04080a, 0 0 44px #ffcf4a33;
  }
  .slot-name {
    font-size: 20px; line-height: 1.5; color: #fff;
    overflow: hidden; text-overflow: ellipsis; display: -webkit-box;
    -webkit-line-clamp: 3; -webkit-box-orient: vertical;
  }
  .slot-cat { font-size: 8px; margin-top: 14px; letter-spacing: 0.16em; }
  .slot-take { font-size: 12px; color: #93b57c; letter-spacing: 0.18em; opacity: 0; }
  .slot.done .slot-take { opacity: 1; }
  .slot.done .slot-reel { animation: slot-pop 0.5s ease-out; }
  @keyframes slot-pop {
    0%   { transform: scale(0.9); box-shadow: 0 6px 0 #04080a, 0 0 0 #ffcf4a00; }
    45%  { transform: scale(1.06); box-shadow: 0 6px 0 #04080a, 0 0 90px #ffcf4aaa; }
    100% { transform: scale(1); }
  }
  /* Іскри — вісім пікселів, що розлітаються від центру рамки */
  .spark { position: absolute; width: 6px; height: 6px; background: #ffcf4a; opacity: 0; }
  .slot.done .spark { animation: spark-fly 0.85s ease-out forwards; }
  @keyframes spark-fly {
    0%   { opacity: 1; transform: translate(0, 0) scale(1); }
    100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0.4); }
  }

  /* Плашка призу: висить у кутку решту хвилини */
  .prize {
    position: fixed; right: 18px; bottom: 42px; z-index: 5;
    display: none; align-items: center; gap: 14px;
    padding: 12px 18px; background: #141008f2;
    border: 3px solid #ffcf4a; box-shadow: 0 4px 0 #04080a;
    max-width: min(38vw, 420px);
  }
  .prize.on { display: flex; }
  .prize-icon { font-size: 18px; flex: none; }
  .prize-t { font-size: 6px; color: #ffcf4a; letter-spacing: 0.16em; }
  .prize-name {
    font-size: 9px; color: #fff; margin-top: 7px; line-height: 1.5;
    overflow: hidden; text-overflow: ellipsis; display: -webkit-box;
    -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }
  .prize-sec { font-size: 14px; color: #ffcf4a; flex: none; }

</style>
</head>
<body>

<canvas id="game"></canvas>

<div class="door" id="door">
  <div class="door-icon" id="door-icon">🔒</div>
  <div>
    <div class="door-state" id="door-state"></div>
    <div class="door-beer" id="door-beer"></div>
  </div>
</div>

<div class="splash" id="splash">
  <div class="splash-n" id="splash-n"></div>
  <div class="splash-t" id="splash-t"></div>
</div>

<div class="map-wrap">
  <canvas id="minimap"></canvas>
  <div class="map-label">КАРТА<span class="dot" id="dot"></span></div>
</div>

<div class="legend" id="legend"></div>

<div class="call" id="call">
  <div class="call-arrow" id="call-arrow">↗</div>
  <div>
    <div class="call-beer" id="call-beer"></div>
    <div class="call-dir" id="call-dir"></div>
  </div>
  <div class="call-qty" id="call-qty"></div>
</div>

<div class="fruit" id="fruit">
  <div class="fruit-swatch" id="fruit-swatch"></div>
  <div>
    <div class="fruit-name" id="fruit-name"></div>
    <div class="fruit-desc" id="fruit-desc"></div>
  </div>
</div>

<div class="win" id="win">
  <div class="win-t">ВИХІД ЗНАЙДЕНО</div>
  <div class="win-s" id="win-s"></div>
</div>

<div class="slot" id="slot">
  <div class="slot-t">БЕЗКОШТОВНЕ ПИВО</div>
  <div class="slot-reel" id="slot-reel">
    <div class="slot-name" id="slot-name"></div>
    <div class="slot-cat" id="slot-cat"></div>
  </div>
  <div class="slot-take">ЗАБЕРИ НА БАРІ</div>
</div>

<div class="prize" id="prize">
  <div class="prize-icon">🍺</div>
  <div>
    <div class="prize-t">ВИГРАШ — ЗАБЕРИ НА БАРІ</div>
    <div class="prize-name" id="prize-name"></div>
  </div>
  <div class="prize-sec" id="prize-sec">60</div>
</div>

<script src="/maze-core.js"></script>
<script src="/beer-groups.js"></script>
<script>
const $ = id => document.getElementById(id);

const VIEW_H    = 108;   // логічна висота кадру: що менша, то сильніший зум
const SHOW_MS   = 1500;  // скільки видно «що купили», перш ніж герой піде
const STEP_MS   = 900;   // пауза після ходу, перед наступною покупкою
const SLOTS     = 5;     // безкоштовних пив на сесію
const PRIZE_MS  = 60000; // скільки виграш висить на екрані
const REEL_MS   = 2200;  // скільки крутиться барабан

// Кольори стрілок на полі = кольори груп у легенді
beerApplyDirColors();

const maze = new Maze({ dirs: 4, slots: SLOTS });
const cv   = $('game');
const ctx  = cv.getContext('2d');
const mini = $('minimap');
const mctx = mini.getContext('2d');

// ─── Камера ────────────────────────────────────────────────────────────────
// Тримається за героєм із плавним доганянням, координати округлюються —
// інакше піксельна сітка «пливе» під час руху.
let camX = 0, camY = 0, camReady = false;

function fitCanvas() {
  const aspect = window.innerWidth / window.innerHeight;
  cv.height = VIEW_H;
  cv.width  = Math.max(150, Math.min(340, Math.round(VIEW_H * aspect)));
}

function updateCamera() {
  const [tx, ty] = maze.playerCenter();
  const gx = tx - cv.width / 2;
  const gy = ty - cv.height / 2;
  if (!camReady) { camX = gx; camY = gy; camReady = true; return; }
  camX += (gx - camX) * 0.12;
  camY += (gy - camY) * 0.12;
}

const MINI_CELL = 5;
function fitMinimap() {
  const { W, H } = maze.dims();
  mini.width  = W * MINI_CELL;
  mini.height = H * MINI_CELL;
  mini.style.width  = (W * MINI_CELL * 1.7) + 'px';
  mini.style.height = (H * MINI_CELL * 1.7) + 'px';
}

function frame(t) {
  updateCamera();
  maze.render(ctx, t, { w: cv.width, h: cv.height, ox: camX, oy: camY });
  maze.drawMinimap(mctx, MINI_CELL, t);
  requestAnimationFrame(frame);
}

// ─── HUD ───────────────────────────────────────────────────────────────────
// Лічильники з екрана прибрані, лишився тільки екран перемоги.
function updateHud() {
  $('win').classList.toggle('on', maze.won);
  if (maze.won) $('win-s').textContent = 'КРОКІВ: ' + maze.steps + '\nФРУКТІВ: ' + maze.fruitsGot() + '/' + maze.fruitTotal;
}

let callTimer;
function showCall(beerName, arrow, dirText, slid, qtyText, color) {
  $('call-arrow').textContent = arrow;
  $('call-arrow').style.color = color || '#ffcf4a';
  $('call').style.borderColor = color || '#6e8f5a';
  $('call-beer').textContent  = beerName;
  $('call-dir').textContent   = dirText;
  $('call-qty').textContent   = qtyText || '';
  $('call').classList.toggle('slid', slid);
  $('call').classList.add('on');
  clearTimeout(callTimer);
  callTimer = setTimeout(() => $('call').classList.remove('on'), STEP_MS + 2200);
}

let fruitTimer;
function showFruit(fruit) {
  $('fruit-swatch').style.background = fruit.color;
  $('fruit-name').textContent = fruit.name;
  $('fruit-desc').textContent = fruit.desc;
  $('fruit').classList.add('on');
  clearTimeout(fruitTimer);
  fruitTimer = setTimeout(() => $('fruit').classList.remove('on'), 4200);
}

// ─── Каталог пива ──────────────────────────────────────────────────────────
// Меню потрібне тільки для слотів: група покупки рахується з назви прямо в
// транзакції, тож жодного мапінгу кранів більше немає.
let beerPool = [];

async function loadCatalog() {
  try {
    const data = await (await fetch('/api/products')).json();
    beerPool = (data.products || []).filter(p => p.name && beerGroupFor(p.name, p.category));
  } catch (_) { beerPool = []; }
  pickDoorKey();
  renderLegend();
}

// ─── Ключ від дверей ───────────────────────────────────────────────────────
// Ключ — не конкретна позиція, а ціла група: «замов темне». Інакше з 1300
// найменувань шанс, що хтось візьме саме потрібну пляшку, майже нульовий.
function pickDoorKey() {
  const g = BEER_GROUPS[Math.floor(Math.random() * BEER_GROUPS.length)];
  maze.setDoorKey({ id: g.key, name: g.name, group: g.key });
  renderDoorBanner();
}

function renderDoorBanner() {
  const k = maze.doorKey;
  const el = $('door');
  if (!k) { el.classList.remove('on'); return; }
  const g = beerGroupByKey(k.group);
  $('door-beer').textContent = k.name + (g ? '  ' + g.arrow : '');
  $('door-beer').style.color = maze.doorOpen ? '#ffcf4a' : (g ? g.color : '#fff');
  $('door-state').textContent = maze.doorOpen ? 'ДВЕРІ ВІДЧИНЕНО — ЙДИ ДО НИХ' : 'ЩОБ ВІДЧИНИТИ ДВЕРІ — ЗАМОВ';
  el.classList.toggle('open', maze.doorOpen);
  el.classList.add('on');
}

// ─── Легенда: чотири групи пива, по одній на напрямок ──────────────────────
const groupEls = {};   // groupKey -> { box, last }

function renderLegend() {
  const box = $('legend');
  box.textContent = '';
  Object.keys(groupEls).forEach(k => delete groupEls[k]);

  BEER_GROUPS.forEach(g => {
    const wrap = document.createElement('div');
    wrap.className = 'lg-group';
    wrap.style.borderLeftColor = g.color;

    const arrow = document.createElement('div');
    arrow.className = 'lg-arrow';
    arrow.style.color = g.color;
    arrow.textContent = g.arrow;

    const body = document.createElement('div');
    body.className = 'lg-beers';

    const title = document.createElement('div');
    title.className = 'lg-beer';
    title.style.color = g.color;
    title.style.fontSize = '10px';
    title.textContent = g.name;

    const hint = document.createElement('div');
    hint.className = 'lg-beer';
    hint.textContent = g.hint;

    // Тут показуємо останнє куплене з групи — щоб гість бачив живий приклад
    const last = document.createElement('div');
    last.className = 'lg-beer';
    last.style.color = '#6e8f5a';

    body.append(title, hint, last);
    wrap.append(arrow, body);
    box.appendChild(wrap);
    groupEls[g.key] = { box: wrap, last };
  });
}

// Підсвітити групу, з якої щойно купили
const flashTimers = {};
function flashLegend(groupKey, beerName) {
  const g = groupEls[groupKey];
  if (!g) return;
  g.box.classList.add('flash');
  if (beerName) { g.last.textContent = beerName; g.last.classList.add('hit'); }
  clearTimeout(flashTimers[groupKey]);
  flashTimers[groupKey] = setTimeout(() => {
    g.box.classList.remove('flash');
    g.last.classList.remove('hit');
  }, SHOW_MS + STEP_MS + 1500);
}

// ─── Черга ходів ───────────────────────────────────────────────────────────
// Кожна покупка програється у дві фази: спершу на екрані зʼявляється, що саме
// купили, і тільки через SHOW_MS герой робить хід. Так гість встигає повʼязати
// свій келих із рухом на стіні.
const queue = [];
let playing = false;
let paused = false;      // на час слот-анімації черга стоїть

function enqueue(beerName, group, label) {
  queue.push({ beerName, group, label });
  if (!playing && !paused) playNext();
}

function playNext() {
  if (paused) { playing = false; return; }
  const item = queue.shift();
  if (!item) { playing = false; return; }
  playing = true;

  const g = item.group;
  flashLegend(g.key, item.beerName);

  // Фаза 1 — тільки покупка, ходу ще немає
  showCall(item.beerName, '🍺', 'КУПЛЕНО · ' + g.name, false, item.label, g.color);
  setTimeout(() => doMove(item), SHOW_MS);
}

// Фаза 2 — власне хід
function doMove(item) {
  const g = item.group;
  const action = mazeActionByKey(g.dir);

  // Куплено пиво з групи-ключа — двері відмикаються, навіть якщо герой далеко
  if (maze.doorKey && maze.doorKey.group === g.key && !maze.doorOpen) {
    maze.openDoor();
    maze.doorFound = true;          // і одразу показуємо, де вони
    renderDoorBanner();
    showKeyUnlocked(g.name);
  }

  const resolved = maze.resolveDirection(action.d[0], action.d[1]);
  if (!resolved) {
    showCall(item.beerName, '⤫', 'ГЛУХИЙ КУТ', false, item.label, '#9aa0a8');
    updateHud();
    setTimeout(playNext, STEP_MS);
    return;
  }

  const { fruit, result, slot } = maze.move(resolved.d[0], resolved.d[1]);
  if (fruit) showFruit(fruit);

  if (result === 'door-locked') {
    showCall(item.beerName, '🔒', 'ДВЕРІ ЗАМКНЕНІ', false, item.label, '#9aa0a8');
  } else if (resolved.slid) {
    // Стрілка й рамка беруть колір фактичного напрямку — того, куди герой пішов
    showCall(item.beerName, mazeArrowForVec(resolved.d),
      'ОБХІД СТІНИ ' + action.arrow + '→' + mazeArrowForVec(resolved.d),
      true, item.label, mazeColorForVec(resolved.d));
  } else {
    showCall(item.beerName, action.arrow, g.name + ' ' + action.arrow, false, item.label, g.color);
  }

  updateHud();

  // Слот важливіший за двері: спершу віддаємо виграш, кімната зачекає
  if (slot) { openSlot(result === 'door-open'); return; }
  if (result === 'door-open') { enterNextRoom(); return; }
  setTimeout(playNext, STEP_MS);
}

// ─── Слот: безкоштовне пиво ────────────────────────────────────────────────
// Барабан крутить назви з меню, зупиняється на призі, показує анімацію
// виграшу — і їде в куток дотикати хвилину, поки гра йде далі.
let reelTimer, prizeTimer, prizeTick;

function openSlot(thenNextRoom) {
  if (!beerPool.length) { setTimeout(playNext, STEP_MS); return; }
  paused = true;

  const prize = beerPool[Math.floor(Math.random() * beerPool.length)];
  const pg = beerGroupFor(prize.name, prize.category);

  $('slot').classList.remove('done');
  $('slot').classList.add('on');
  $('slot-cat').textContent = '';

  clearInterval(reelTimer);
  reelTimer = setInterval(() => {
    const r = beerPool[Math.floor(Math.random() * beerPool.length)];
    $('slot-name').textContent = r.name;
    $('slot-name').style.color = '#8a7a55';
  }, 70);

  setTimeout(() => {
    clearInterval(reelTimer);
    $('slot-name').textContent = prize.name;
    $('slot-name').style.color = '#fff';
    $('slot-cat').textContent = (pg ? pg.name + ' · ' : '') + (prize.category || '');
    $('slot-cat').style.color = pg ? pg.color : '#93b57c';
    $('slot').classList.add('done');
    spawnSparks();
  }, REEL_MS);

  // Повний екран гасне, приз переїжджає в куток і дотикає до хвилини
  setTimeout(() => {
    $('slot').classList.remove('on');
    showPrizeBanner(prize.name, PRIZE_MS - (REEL_MS + 2800));
    paused = false;
    updateHud();
    if (thenNextRoom) enterNextRoom(); else setTimeout(playNext, STEP_MS);
  }, REEL_MS + 2800);
}

function spawnSparks() {
  const reel = $('slot-reel');
  reel.querySelectorAll('.spark').forEach(s => s.remove());
  for (let i = 0; i < 10; i++) {
    const s = document.createElement('div');
    s.className = 'spark';
    const a = (Math.PI * 2 * i) / 10;
    s.style.setProperty('--dx', Math.round(Math.cos(a) * 190) + 'px');
    s.style.setProperty('--dy', Math.round(Math.sin(a) * 130) + 'px');
    s.style.left = '50%';
    s.style.top  = '50%';
    reel.appendChild(s);
  }
}

function showPrizeBanner(name, ms) {
  $('prize-name').textContent = name;
  $('prize').classList.add('on');
  const until = Date.now() + ms;
  clearInterval(prizeTick);
  prizeTick = setInterval(() => {
    const left = Math.max(0, Math.round((until - Date.now()) / 1000));
    $('prize-sec').textContent = left;
    if (left <= 0) clearInterval(prizeTick);
  }, 250);
  clearTimeout(prizeTimer);
  prizeTimer = setTimeout(() => $('prize').classList.remove('on'), ms);
}

// ─── Ключ і перехід у наступну кімнату ─────────────────────────────────────
function showKeyUnlocked(beerName) {
  $('door-icon').textContent = '🔑';
  showFruit({ color: '#ffcf4a', name: 'КЛЮЧ: ' + beerName, desc: 'ДВЕРІ ВІДЧИНЕНО' });
}

function showRoomSplash() {
  $('splash-n').textContent = 'КІМНАТА ' + (maze.roomIndex + 1);
  $('splash-t').textContent = maze.biome().name;
  $('splash-t').style.color = maze.biome().accent;
  $('splash').classList.add('on');
  setTimeout(() => $('splash').classList.remove('on'), 1900);
}

function enterNextRoom() {
  maze.nextRoom();
  camReady = false;          // камера стрибає на нову стартову клітину без анімації
  $('door-icon').textContent = '🔒';
  pickDoorKey();
  renderLegend();
  updateHud();
  showRoomSplash();
  setTimeout(playNext, 2100);   // черга продовжиться вже в новій кімнаті
}

// ─── Транзакції ────────────────────────────────────────────────────────────
function onTransaction(tx) {
  (tx.products || []).forEach(p => {
    // Горішки, кава, посуд і пакування гру не рухають узагалі
    const g = beerGroupFor(p.name, p.category);
    if (!g) return;
    const qty = Math.max(1, Math.round(Number(p.quantity) || 1));
    for (let i = 0; i < qty; i++) {
      enqueue(p.name, g, qty > 1 ? (i + 1) + '/' + qty : '');
    }
  });
}

// ─── WebSocket ─────────────────────────────────────────────────────────────
let reconnectTimer;
function connect() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const ws = new WebSocket(proto + '//' + location.host);
  ws.onopen    = () => { $('dot').classList.add('on'); clearTimeout(reconnectTimer); };
  ws.onmessage = e => { try { onTransaction(JSON.parse(e.data)); } catch (_) {} };
  ws.onclose   = () => { $('dot').classList.remove('on'); reconnectTimer = setTimeout(connect, 2000); };
  ws.onerror   = () => ws.close();
}

// ─── Керування (тільки для оператора) ──────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'f' || e.key === 'F') {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen();
  }
  if (e.key === 'r' || e.key === 'R') {
    queue.length = 0;
    paused = false;
    maze.slotCount = SLOTS;      // нова сесія — знову пʼять безкоштовних
    maze.restart();
    camReady = false;
    $('door-icon').textContent = '🔒';
    $('prize').classList.remove('on');
    pickDoorKey();
    renderLegend();
    updateHud();
  }
  // S — прокрутити слот вручну: для перевірки перед івентом і для бармена
  if ((e.key === 's' || e.key === 'S') && !paused) openSlot(false);
});

let cursorTimer;
document.addEventListener('mousemove', () => {
  document.body.classList.add('show-cursor');
  clearTimeout(cursorTimer);
  cursorTimer = setTimeout(() => document.body.classList.remove('show-cursor'), 2200);
});

window.addEventListener('resize', fitCanvas);

fitCanvas();
fitMinimap();
loadCatalog();
connect();
updateHud();
requestAnimationFrame(frame);
</script>
