<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Poster Live</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0a0a;
      color: #f0f0f0;
      font-family: 'Courier New', monospace;
      min-height: 100vh;
      padding: 24px;
    }

    header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      border-bottom: 1px solid #222;
      padding-bottom: 16px;
    }

    h1 { font-size: 18px; font-weight: normal; letter-spacing: 0.1em; color: #fff; }

    #status {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 20px;
      background: #1a1a1a;
      color: #555;
    }
    #status.connected { background: #0f2a0f; color: #4caf50; }

    #session {
      margin-left: auto;
      font-size: 12px;
      color: #555;
    }
    #session b { color: #888; font-weight: normal; }

    #stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }

    .stat {
      background: #111;
      border: 1px solid #1e1e1e;
      border-radius: 8px;
      padding: 16px;
    }
    .stat-label { font-size: 11px; color: #555; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.05em; }
    .stat-value { font-size: 24px; color: #fff; }

    #feed { display: flex; flex-direction: column; gap: 10px; }

    .card {
      background: #111;
      border: 1px solid #1e1e1e;
      border-radius: 8px;
      padding: 16px;
      animation: slideIn 0.3s ease;
    }
    .card.new { border-color: #2a3a2a; }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
      gap: 12px;
    }

    .card-id { font-size: 11px; color: #444; }
    .card-time { font-size: 11px; color: #444; text-align: right; }
    .card-sum { font-size: 20px; color: #fff; }
    .card-meta { font-size: 11px; color: #555; margin-top: 2px; }

    .card-pay { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }

    .badge {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
      background: #1a1a1a;
      color: #666;
    }
    .badge.cash { background: #1a2a1a; color: #4caf50; }
    .badge.card { background: #1a1a2a; color: #5c8fff; }
    .badge.dur  { background: #2a221a; color: #d4a14a; }
    .badge.tbl  { background: #1f1a2a; color: #b48ff5; }
    .badge.mode { background: #1a262a; color: #6cb8c4; }
    .badge.guests { background: #221a1f; color: #c47b9e; }

    .comment {
      background: #161616;
      border-left: 2px solid #d4a14a;
      padding: 8px 12px;
      margin-bottom: 12px;
      font-size: 13px;
      color: #c8b890;
      font-style: italic;
    }
    .comment::before { content: '💬 '; }

    .products { border-top: 1px solid #1e1e1e; padding-top: 10px; }

    .product-row {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 10px;
      align-items: baseline;
      padding: 4px 0;
      font-size: 13px;
    }
    .product-name { color: #ccc; }
    .product-category {
      display: inline-block;
      font-size: 10px;
      color: #777;
      background: #1a1a1a;
      padding: 1px 6px;
      border-radius: 3px;
      margin-left: 8px;
      vertical-align: middle;
    }
    .product-qty  { color: #555; }
    .product-sum  { color: #888; }

    #empty {
      text-align: center;
      padding: 60px 0;
      color: #333;
      font-size: 14px;
    }
  </style>
</head>
<body>

<header>
  <h1>POSTER LIVE</h1>
  <div id="status">● відключено</div>
  <div id="session">Сесія: <b id="session-time">00:00:00</b></div>
</header>

<div id="stats">
  <div class="stat">
    <div class="stat-label">Транзакцій</div>
    <div class="stat-value" id="stat-count">0</div>
  </div>
  <div class="stat">
    <div class="stat-label">Загальна сума</div>
    <div class="stat-value" id="stat-total">0 грн</div>
  </div>
  <div class="stat">
    <div class="stat-label">Остання покупка</div>
    <div class="stat-value" id="stat-last">—</div>
  </div>
</div>

<div id="feed">
  <div id="empty">Очікую транзакції...</div>
</div>

<script>
  let count = 0;
  let total = 0;
  const seenTxIds = new Set();

  const statusEl    = document.getElementById('status');
  const feedEl      = document.getElementById('feed');
  const emptyEl     = document.getElementById('empty');
  const statCount   = document.getElementById('stat-count');
  const statTotal   = document.getElementById('stat-total');
  const statLast    = document.getElementById('stat-last');
  const sessionTime = document.getElementById('session-time');

  // Active session timer
  const sessionStart = Date.now();
  function pad(n) { return String(n).padStart(2, '0'); }
  function formatHMS(sec) {
    const h = Math.floor(sec / 3600);
    const m = Math.floor((sec % 3600) / 60);
    const s = sec % 60;
    return `${pad(h)}:${pad(m)}:${pad(s)}`;
  }
  setInterval(() => {
    const sec = Math.floor((Date.now() - sessionStart) / 1000);
    sessionTime.textContent = formatHMS(sec);
  }, 1000);

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls)  e.className   = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function serviceModeLabel(m) {
    if (m === 1) return 'у залі';
    if (m === 2) return 'на виніс';
    if (m === 3) return 'доставка';
    return null;
  }

  function buildCard(tx) {
    const card = el('div', 'card new');

    // Header
    const header = el('div', 'card-header');
    const left = el('div');
    left.appendChild(el('div', 'card-id',  '#' + tx.transaction_id));
    left.appendChild(el('div', 'card-sum', tx.sum.toFixed(2) + ' грн'));
    if (tx.client) left.appendChild(el('div', 'card-meta', '👤 ' + tx.client));
    header.appendChild(left);

    const right = el('div');
    right.appendChild(el('div', 'card-time', tx.time || ''));
    if (tx.date_start) right.appendChild(el('div', 'card-meta', 'старт: ' + tx.date_start.slice(11, 16)));
    header.appendChild(right);
    card.appendChild(header);

    // Badges row: payment + duration + table + mode + guests
    const pay = el('div', 'card-pay');
    if (tx.payed_cash > 0) pay.appendChild(el('span', 'badge cash', 'готівка ' + tx.payed_cash + ' грн'));
    if (tx.payed_card > 0) pay.appendChild(el('span', 'badge card', 'картка ' + tx.payed_card + ' грн'));
    if (tx.duration_sec != null) pay.appendChild(el('span', 'badge dur', '⏱ ' + formatHMS(tx.duration_sec)));
    if (tx.table) pay.appendChild(el('span', 'badge tbl', '🪑 ' + tx.table));
    if (tx.guests) pay.appendChild(el('span', 'badge guests', '👥 ' + tx.guests));
    const modeLabel = serviceModeLabel(tx.service_mode);
    if (modeLabel) pay.appendChild(el('span', 'badge mode', modeLabel));
    if (pay.children.length) card.appendChild(pay);

    // Comment
    if (tx.comment) card.appendChild(el('div', 'comment', tx.comment));

    // Products
    const products = el('div', 'products');
    tx.products.forEach(p => {
      const row = el('div', 'product-row');
      const nameWrap = el('span', 'product-name', p.name);
      if (p.category) {
        const cat = el('span', 'product-category', p.category);
        nameWrap.appendChild(cat);
      }
      row.appendChild(nameWrap);
      row.appendChild(el('span', 'product-qty', '× ' + p.quantity));
      row.appendChild(el('span', 'product-sum', p.sum + ' грн'));
      products.appendChild(row);
    });
    card.appendChild(products);

    return card;
  }

  function addTransaction(tx) {
    if (seenTxIds.has(tx.transaction_id)) return; // client-side dedupe
    seenTxIds.add(tx.transaction_id);

    emptyEl.style.display = 'none';

    count++;
    total += tx.sum;

    statCount.textContent = count;
    statTotal.textContent = total.toFixed(0) + ' грн';
    statLast.textContent  = tx.sum.toFixed(0) + ' грн';

    const card = buildCard(tx);
    feedEl.insertBefore(card, feedEl.firstChild);
    setTimeout(() => card.classList.remove('new'), 3000);
  }

  function connect() {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws = new WebSocket(proto + '//' + location.host);

    ws.onopen = () => {
      statusEl.textContent = '● підключено';
      statusEl.className   = 'connected';
    };

    ws.onclose = () => {
      statusEl.textContent = '● відключено';
      statusEl.className   = '';
      setTimeout(connect, 3000);
    };

    ws.onmessage = (e) => {
      try {
        addTransaction(JSON.parse(e.data));
      } catch (_) {}
    };
  }

  connect();
</script>
</body>
</html>
