<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Poster Viz</title>
  <style>
    :root {
      --amber: #d4a14a;
      --green: #4caf50;
      --dim:   #3a3a3a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; overflow: hidden; }

    body {
      background: #000;
      color: #f0f0f0;
      font-family: 'Courier New', monospace;
      display: flex;
      flex-direction: column;
      cursor: none;
    }
    body.show-cursor { cursor: default; }

    /* ─── Верхня панель ─────────────────────────────────────── */
    .hud {
      display: flex;
      align-items: center;
      gap: 40px;
      padding: 22px 34px;
      border-bottom: 1px solid #141414;
      flex-shrink: 0;
    }

    .metric-label {
      font-size: 10px;
      color: #444;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .metric-value { font-size: 30px; line-height: 1; color: #fff; }
    .metric-value .unit { font-size: 15px; color: #555; margin-left: 5px; }

    .status {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 11px;
      color: #444;
      letter-spacing: 0.1em;
    }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #333;
      transition: background 0.3s;
    }
    .dot.on { background: var(--green); box-shadow: 0 0 10px rgba(76,175,80,0.7); }

    #emu-badge {
      font-size: 10px;
      letter-spacing: 0.14em;
      padding: 4px 11px;
      border-radius: 3px;
      background: #2a1a00;
      color: var(--amber);
      opacity: 0;
      transition: opacity 0.4s;
    }
    #emu-badge.on { opacity: 1; }

    /* ─── Сцена ─────────────────────────────────────────────── */
    .stage {
      flex: 1;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 30px;
      overflow: hidden;
    }

    .idle {
      color: #1c1c1c;
      font-size: 15px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      animation: breathe 3.5s ease-in-out infinite;
    }
    @keyframes breathe { 0%,100% { opacity: 0.35; } 50% { opacity: 1; } }

    .drop {
      display: flex;
      align-items: baseline;
      gap: 20px;
      max-width: 92vw;
      animation: pour 0.55s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .drop.out { animation: fade 0.8s ease forwards; }

    @keyframes pour {
      from { opacity: 0; transform: translateY(34px) scale(0.94); filter: blur(6px); }
      to   { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
    }
    @keyframes fade {
      to { opacity: 0; transform: translateY(-22px) scale(0.97); filter: blur(3px); }
    }

    .drop-name {
      font-size: clamp(22px, 3.6vw, 52px);
      color: #fff;
      line-height: 1.1;
      letter-spacing: -0.01em;
    }
    .drop-cat {
      font-size: clamp(10px, 1vw, 14px);
      color: var(--dim);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .drop-qty {
      font-size: clamp(18px, 2.2vw, 32px);
      color: var(--amber);
      white-space: nowrap;
    }

    /* Спалах на весь екран при новому чеку */
    #flash {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 60%, rgba(212,161,74,0.13), transparent 62%);
      opacity: 0;
      pointer-events: none;
    }
    #flash.fire { animation: flash 1.1s ease-out; }
    @keyframes flash { 0% { opacity: 1; } 100% { opacity: 0; } }

    /* ─── Нижня стрічка ─────────────────────────────────────── */
    .ticker {
      flex-shrink: 0;
      border-top: 1px solid #141414;
      padding: 14px 34px;
      display: flex;
      gap: 9px;
      overflow: hidden;
      white-space: nowrap;
      min-height: 48px;
      align-items: center;
    }
    .chip {
      font-size: 11px;
      padding: 4px 11px;
      border-radius: 3px;
      background: #101010;
      color: #5a5a5a;
      flex-shrink: 0;
      animation: slideIn 0.4s ease;
    }
    .chip .n { color: var(--amber); margin-left: 5px; }
    @keyframes slideIn { from { opacity: 0; transform: translateX(-14px); } to { opacity: 1; transform: none; } }

    .hint {
      position: fixed;
      bottom: 62px;
      right: 20px;
      font-size: 10px;
      color: #1e1e1e;
      letter-spacing: 0.1em;
    }
  </style>
</head>
<body>

<div class="hud">
  <div>
    <div class="metric-label">Виручка сесії</div>
    <div class="metric-value"><span id="m-sum">0</span><span class="unit">грн</span></div>
  </div>
  <div>
    <div class="metric-label">Чеків</div>
    <div class="metric-value" id="m-count">0</div>
  </div>
  <div>
    <div class="metric-label">Позицій</div>
    <div class="metric-value" id="m-items">0</div>
  </div>
  <div>
    <div class="metric-label">Середній чек</div>
    <div class="metric-value"><span id="m-avg">0</span><span class="unit">грн</span></div>
  </div>

  <div class="status">
    <span id="emu-badge">ЕМУЛЯЦІЯ</span>
    <span class="dot" id="dot"></span>
    <span id="status-text">підключення...</span>
  </div>
</div>

<div class="stage" id="stage">
  <div id="flash"></div>
  <div class="idle" id="idle">очікування транзакцій</div>
</div>

<div class="ticker" id="ticker"></div>
<div class="hint">F — на весь екран</div>

<script>
  // ─── Налаштування ──────────────────────────────────────────────────────────
  const DELAY_MS   = 600;   // пауза між позиціями (як у TouchDesigner-скрипті)
  const LIFETIME   = 5200;  // скільки позиція живе на екрані
  const MAX_ONSCREEN = 5;
  const MAX_CHIPS  = 22;

  const stage     = document.getElementById('stage');
  const idleEl    = document.getElementById('idle');
  const flashEl   = document.getElementById('flash');
  const tickerEl  = document.getElementById('ticker');
  const dot       = document.getElementById('dot');
  const statusText= document.getElementById('status-text');
  const emuBadge  = document.getElementById('emu-badge');

  const mSum   = document.getElementById('m-sum');
  const mCount = document.getElementById('m-count');
  const mItems = document.getElementById('m-items');
  const mAvg   = document.getElementById('m-avg');

  let totalSum = 0, totalCount = 0, totalItems = 0;

  // ─── Метрики ───────────────────────────────────────────────────────────────
  function animateNumber(el, from, to, ms) {
    // Страховка: у фоновій/невидимій вкладці requestAnimationFrame зупиняється,
    // і число застрягло б на старому значенні. setTimeout працює завжди.
    clearTimeout(el._settle);
    el._settle = setTimeout(() => { el.textContent = to; }, ms + 150);

    const start = performance.now();
    function step(now) {
      const t = Math.min(1, (now - start) / ms);
      const eased = 1 - Math.pow(1 - t, 3);
      el.textContent = Math.round(from + (to - from) * eased);
      if (t < 1) requestAnimationFrame(step);
      else el.textContent = to;
    }
    requestAnimationFrame(step);
  }

  function updateMetrics(tx) {
    const prevSum = totalSum;
    totalSum   += Number(tx.sum) || 0;
    totalCount += 1;
    totalItems += (tx.products || []).reduce((a, p) => a + (Number(p.quantity) || 0), 0);

    animateNumber(mSum, prevSum, totalSum, 700);
    mCount.textContent = totalCount;
    mItems.textContent = totalItems;
    mAvg.textContent   = Math.round(totalSum / totalCount);
  }

  // ─── Сцена ─────────────────────────────────────────────────────────────────
  function showProduct(p) {
    idleEl.style.display = 'none';

    const el = document.createElement('div');
    el.className = 'drop';

    const name = document.createElement('span');
    name.className = 'drop-name';
    name.textContent = p.name;
    el.appendChild(name);

    if (p.category) {
      const cat = document.createElement('span');
      cat.className = 'drop-cat';
      cat.textContent = p.category;
      el.appendChild(cat);
    }

    if (Number(p.quantity) > 1) {
      const qty = document.createElement('span');
      qty.className = 'drop-qty';
      qty.textContent = '×' + p.quantity;
      el.appendChild(qty);
    }

    stage.appendChild(el);

    // не даємо сцені переповнитись
    const drops = stage.querySelectorAll('.drop:not(.out)');
    if (drops.length > MAX_ONSCREEN) retire(drops[0]);

    setTimeout(() => retire(el), LIFETIME);
    addChip(p);
  }

  function retire(el) {
    if (!el || el.classList.contains('out')) return;
    el.classList.add('out');
    setTimeout(() => {
      el.remove();
      if (!stage.querySelector('.drop')) idleEl.style.display = '';
    }, 800);
  }

  function addChip(p) {
    const chip = document.createElement('span');
    chip.className = 'chip';
    chip.appendChild(document.createTextNode(p.name));
    if (Number(p.quantity) > 1) {
      const n = document.createElement('span');
      n.className = 'n';
      n.textContent = '×' + p.quantity;
      chip.appendChild(n);
    }
    tickerEl.insertBefore(chip, tickerEl.firstChild);
    while (tickerEl.children.length > MAX_CHIPS) tickerEl.lastChild.remove();
  }

  function onTransaction(tx) {
    updateMetrics(tx);

    emuBadge.classList.toggle('on', tx._emulated === true);

    flashEl.classList.remove('fire');
    void flashEl.offsetWidth;
    flashEl.classList.add('fire');

    // позиції з'являються по черзі — той самий ритм, що й у TouchDesigner
    (tx.products || []).forEach((p, i) => setTimeout(() => showProduct(p), i * DELAY_MS));
  }

  // ─── WebSocket ─────────────────────────────────────────────────────────────
  let ws, reconnectTimer;

  function connect() {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(proto + '//' + location.host);

    ws.onopen = () => {
      dot.classList.add('on');
      statusText.textContent = 'наживо';
      clearTimeout(reconnectTimer);
    };

    ws.onmessage = e => {
      try { onTransaction(JSON.parse(e.data)); }
      catch (_) { /* не наш пакет — ігноруємо */ }
    };

    ws.onclose = () => {
      dot.classList.remove('on');
      statusText.textContent = 'перепідключення...';
      reconnectTimer = setTimeout(connect, 2000);
    };

    ws.onerror = () => ws.close();
  }

  connect();

  // ─── Керування ─────────────────────────────────────────────────────────────
  document.addEventListener('keydown', e => {
    if (e.key === 'f' || e.key === 'F') {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen();
    }
  });

  let cursorTimer;
  document.addEventListener('mousemove', () => {
    document.body.classList.add('show-cursor');
    clearTimeout(cursorTimer);
    cursorTimer = setTimeout(() => document.body.classList.remove('show-cursor'), 2500);
  });
</script>
</body>
</html>
